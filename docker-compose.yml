services:
  gateway:
    image: nginx:1.27-alpine
    container_name: anr-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/gateway/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/gateway/certbot/conf:/etc/letsencrypt
      - ./infrastructure/gateway/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - landing
      - admin
      - uptime-kuma
      - grafana
    networks:
      - anr-network

  certbot:
    image: certbot/certbot:latest
    container_name: anr-certbot
    restart: unless-stopped
    volumes:
      - ./infrastructure/gateway/certbot/conf:/etc/letsencrypt
      - ./infrastructure/gateway/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - anr-network

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: anr-landing
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - anr-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: anr-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - anr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anr-backend
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SERVER_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-anr_user}
      - DB_PASSWORD=${DB_PASSWORD:-anr_password}
      - DB_NAME=${DB_NAME:-anr_platform}
      - DB_SSLMODE=disable
      - DB_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-please_set_a_secure_jwt_secret_in_production_min_32_chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anr-network

  postgres:
    image: postgres:16-alpine
    container_name: anr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-anr_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-anr_password}
      - POSTGRES_DB=${DB_NAME:-anr_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_platform.up.sql:/docker-entrypoint-initdb.d/01_init_platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anr_user} -d ${DB_NAME:-anr_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anr-network

  redis:
    image: redis:7-alpine
    container_name: anr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - anr-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: anr-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - anr-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: anr-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - anr-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: anr-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - anr-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: anr-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123@anr}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.anr-studio.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - anr-network

networks:
  anr-network:
    name: anr-network
    driver: bridge

volumes:
  postgres_data:
    name: anr-postgres-data
  redis_data:
    name: anr-redis-data
  uptime_kuma_data:
    name: anr-uptime-kuma-data
  prometheus_data:
    name: anr-prometheus-data
  grafana_data:
    name: anr-grafana-data

